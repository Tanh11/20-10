<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chúc mừng Ngày Phụ Nữ Việt Nam</title>
<style>
  :root{--bg:#ffffff;--pink:#FF5CA4;--text:#ffc0dd}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Segoe UI, Roboto, Arial}
  .stage{height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  #pinkboard{width:min(720px,90vw);height:min(720px,90vw);max-width:800px;max-height:800px;display:block}
  /* subtle breathing of canvas container */
  .heart-wrap{position:relative;display:flex;align-items:center;justify-content:center;animation:breath 1.6s ease-in-out infinite}
  @keyframes breath{0%{transform:scale(1)}50%{transform:scale(0.95)}100%{transform:scale(1)}}
  /* greeting overlay */
  .greeting{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;color:var(--text);padding:24px
  }
  .greeting h1{margin:0;font-size:clamp(20px,4vw,44px);letter-spacing:0.02em;color:var(--pink);text-shadow:0 6px 18px rgba(255, 255, 255, 0.6)}
  .greeting p{margin-top:8px;margin-bottom:0;font-size:clamp(14px,2.2vw,22px);opacity:.95}
  /* floating small hearts behind text */
  .floating-heart{
    position:absolute;width:36px;height:36px;left:8%;top:12%;opacity:.12;
    background:var(--pink);transform:rotate(45deg);border-radius:8px;
    box-shadow:0 6px 18px rgba(255,92,164,.18);
    animation:float 6s linear infinite;
  }
  .floating-heart:before,.floating-heart:after{
    content:"";position:absolute;top:-50%;left:0;width:100%;height:100%;background:var(--pink);border-radius:50%;
  }
  .floating-heart:after{left:50%;}
  @keyframes float{
    0%{transform:translateY(0) rotate(45deg) scale(1);opacity:.12}
    50%{transform:translateY(-40px) rotate(45deg) scale(1.05);opacity:.22}
    100%{transform:translateY(0) rotate(45deg) scale(1);opacity:.12}
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="heart-wrap">
      <canvas id="pinkboard" aria-hidden="true"></canvas>
      <div class="greeting" role="img" aria-label="Chúc mừng Ngày Phụ Nữ Việt Nam!">
        <h1>Chúc mừng Ngày Phụ Nữ Việt Nam</h1>
        <p>Con chúc hai Mẹ iu luôn mạnh khỏe, hạnh phúc ❤️</p>
      </div>
      <div class="floating-heart" style="left:6%;top:10%;width:44px;height:44px;animation-duration:7s"></div>
      <div class="floating-heart" style="left:82%;top:18%;width:28px;height:28px;animation-duration:5.8s"></div>
      <div class="floating-heart" style="left:20%;top:70%;width:32px;height:32px;animation-duration:6.6s"></div>
    </div>
  </main>

<script>
/* --- particle heart script (kept from your original) --- */
var settings = { particles:{ length:2000, duration:2, velocity:100, effect:-1.3, size:13 } };
(function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(d){clearTimeout(d)}}}());
var Point=(function(){function a(b,c){this.x=typeof b!=="undefined"?b:0;this.y=typeof c!=="undefined"?c:0}a.prototype.clone=function(){return new a(this.x,this.y)};a.prototype.length=function(b){if(typeof b=="undefined")return Math.sqrt(this.x*this.x+this.y*this.y);this.normalize();this.x*=b;this.y*=b;return this};a.prototype.normalize=function(){var b=this.length();this.x/=b;this.y/=b;return this};return a})();
var Particle=(function(){function a(){this.position=new Point();this.velocity=new Point();this.acceleration=new Point();this.age=0}a.prototype.initialize=function(b,c,d,e){this.position.x=b;this.position.y=c;this.velocity.x=d;this.velocity.y=e;this.acceleration.x=d*settings.particles.effect;this.acceleration.y=e*settings.particles.effect;this.age=0};a.prototype.update=function(a){this.position.x+=this.velocity.x*a;this.position.y+=this.velocity.y*a;this.velocity.x+=this.acceleration.x*a;this.velocity.y+=this.acceleration.y*a;this.age+=a};a.prototype.draw=function(a,b){function c(a){return(--a)*a*a+1}var d=b.width*c(this.age/settings.particles.duration);a.globalAlpha=1-this.age/settings.particles.duration;a.drawImage(b,this.position.x-d/2,this.position.y-d/2,d,d)};return a})();
var ParticlePool=(function(){var b,firstActive=0,firstFree=0,duration=settings.particles.duration;function a(c){b=new Array(c);for(var d=0;d<b.length;d++)b[d]=new Particle()}a.prototype.add=function(a,c,d,e){b[firstFree].initialize(a,c,d,e);firstFree++;if(firstFree==b.length)firstFree=0;if(firstActive==firstFree)firstActive++;if(firstActive==b.length)firstActive=0};a.prototype.update=function(a){var c;if(firstActive<firstFree){for(c=firstActive;c<firstFree;c++)b[c].update(a)}if(firstFree<firstActive){for(c=firstActive;c<b.length;c++)b[c].update(a);for(c=0;c<firstFree;c++)b[c].update(a)}while(b[firstActive].age>=duration&&firstActive!=firstFree){firstActive++;if(firstActive==b.length)firstActive=0}};a.prototype.draw=function(a,c){var d;if(firstActive<firstFree){for(d=firstActive;d<firstFree;d++)b[d].draw(a,c)}if(firstFree<firstActive){for(d=firstActive;d<b.length;d++)b[d].draw(a,c);for(d=0;d<firstFree;d++)b[d].draw(a,c)}};return a})();
(function(canvas){var context=canvas.getContext("2d"),particles=new ParticlePool(settings.particles.length),particleRate=settings.particles.length/settings.particles.duration,time;function pointOnHeart(t){return new Point(160*Math.pow(Math.sin(t),3),130*Math.cos(t)-50*Math.cos(2*t)-20*Math.cos(3*t)-10*Math.cos(4*t)+25)}var image=(function(){var canvas=document.createElement("canvas"),context=canvas.getContext("2d");canvas.width=settings.particles.size;canvas.height=settings.particles.size;function to(t){var p=pointOnHeart(t);p.x=settings.particles.size/2+p.x*settings.particles.size/350;p.y=settings.particles.size/2-p.y*settings.particles.size/350;return p}context.beginPath();var t=-Math.PI;var point=to(t);context.moveTo(point.x,point.y);while(t<Math.PI){t+=0.01;point=to(t);context.lineTo(point.x,point.y)}context.closePath();context.fillStyle="#FF5CA4";context.fill();var img=new Image();img.src=canvas.toDataURL();return img})();function render(){requestAnimationFrame(render);var newTime=new Date().getTime()/1e3,deltaTime=newTime-(time||newTime);time=newTime;context.clearRect(0,0,canvas.width,canvas.height);var amount=particleRate*deltaTime;for(var i=0;i<amount;i++){var pos=pointOnHeart(Math.PI-2*Math.PI*Math.random());var dir=pos.clone().length(settings.particles.velocity);particles.add(canvas.width/2+pos.x,canvas.height/2-pos.y,dir.x,-dir.y)}particles.update(deltaTime);particles.draw(context,image)}function onResize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}window.addEventListener("resize",onResize);setTimeout(function(){onResize();render()},10)})(document.getElementById("pinkboard"));
</script>
</body>
</html>
